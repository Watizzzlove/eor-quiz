    let currentIdx = 0;

    function renderSlide() {
      const s = slides[currentIdx];
      const canvas = document.getElementById('slide-canvas');
      
      if (currentIdx === 0) {
        canvas.style.padding = "0";
        canvas.innerHTML = s.render();
      } else {
        canvas.style.padding = "32px 40px";
        canvas.innerHTML = `
          <div class="slide-badge">${s.badge}</div>
          <div class="slide-title">${s.title}</div>
          ${s.render()}
        `;
      }

      document.getElementById('slide-counter').innerText = `Слайд ${currentIdx + 1} из ${slides.length}`;
      document.getElementById('btn-prev').disabled = (currentIdx === 0);
      document.getElementById('btn-next').disabled = (currentIdx === slides.length - 1);
    }

    function changeSlide(direction) {
      currentIdx += direction;
      if (currentIdx < 0) currentIdx = 0;
      if (currentIdx >= slides.length) currentIdx = slides.length - 1;
      renderSlide();
    }

    function toggleFullscreen() {
      const container = document.querySelector('.player-container');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => alert(`Ошибка: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft') {
        changeSlide(-1);
      }
    });

    renderSlide();
  </script>
