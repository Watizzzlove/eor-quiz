    let currentSlide = 0;

    function renderSlide(index) {
      const s = slides[index];
      const canvas = document.getElementById('slide-canvas');
      
      if (index === 0) {
        canvas.style.padding = "0";
        canvas.innerHTML = s.render();
      } else {
        canvas.style.padding = "28px 36px";
        canvas.innerHTML = `
          <div class="slide-header">
            <span class="badge">${s.badge}</span>
            <h2 class="slide-title">${s.title}</h2>
          </div>
          ${s.render()}
        `;
      }
      
      document.getElementById('slide-counter').textContent = `Слайд ${index + 1} из ${slides.length}`;
      document.getElementById('btn-prev').disabled = (index === 0);
      document.getElementById('btn-next').disabled = (index === slides.length - 1);
      document.getElementById('btn-prev').style.opacity = (index === 0) ? '0.4' : '1';
      document.getElementById('btn-next').style.opacity = (index === slides.length - 1) ? '0.4' : '1';
    }

    function changeSlide(direction) {
      const next = currentSlide + direction;
      if (next >= 0 && next < slides.length) {
        currentSlide = next;
        renderSlide(currentSlide);
      }
    }

    function toggleFullscreen() {
      const el = document.querySelector('.player-container');
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(err => alert("Fullscreen error: " + err.message));
      } else {
        document.exitFullscreen();
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft') {
        changeSlide(-1);
      }
    });

    // Initial render
    renderSlide(0);
